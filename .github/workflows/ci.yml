name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Qt (offscreen) and pymeshlab-style OpenGL libraries for the napari tests
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libglu1-mesa libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: uv sync --locked --extra gui
      - run: uv run ruff check src tests
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
