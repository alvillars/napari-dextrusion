[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "napari-dextrusion"
version = "0.1.0"
description = "napari plugin for DeXtrusion: detect, annotate, review and retrain cellular event detection on 2D+t movies."
readme = "README.rst"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "alvillars" }]
classifiers = [
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "dextrusion",
    "napari>=0.5",
    "numpy>=1.26",
    "qtpy",
]

[project.optional-dependencies]
# napari with a Qt backend, for running the plugin standalone (`uv run napari`)
gui = ["napari[all]>=0.5"]

[project.entry-points."napari.manifest"]
napari-dextrusion = "napari_dextrusion:napari.yaml"

[tool.uv.sources]
dextrusion = { git = "https://github.com/alvillars/dextrusion-torch", branch = "main" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/napari_dextrusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
